name: krizot_app
description: Krizot - Administrative Scheduler for Shift Managers. Cross-platform Flutter app with dynamic station management.
version: 1.0.0001+100000001
publish_to: 'none'

environment:
  sdk: ">=3.13.2 <4.0.0"
  flutter: ">=3.47.2"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^3.4.2
  riverpod_annotation: ^4.0.6

  # HTTP client with interceptors
  dio: ^5.11.0

  # Secure token storage
  flutter_secure_storage: ^11.0.0

  # Firebase Auth (clients sign in with Firebase, backend verifies ID tokens)
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  firebase_app_check: ^0.4.7

  # Routing
  go_router: ^18.0.0

  # Date/time formatting
  intl: ^0.20.3

  # Responsive layout
  responsive_builder: ^0.7.1

  # UI extras
  cupertino_icons: ^1.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.0
  riverpod_generator: ^4.0.8
  mockito: ^5.8.1
  http_mock_adapter: ^0.6.1

flutter:
  uses-material-design: true

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

  assets:
    - assets/images/
    - assets/fonts/
