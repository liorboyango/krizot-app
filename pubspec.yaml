name: krizot_app
description: Krizot - shift scheduling for managers, employees and dispatchers. Flutter + Firebase (Firestore, Auth, Cloud Functions, FCM).
version: 1.0.0001+100000001
publish_to: 'none'

environment:
  sdk: ">=3.13.2 <4.0.0"
  flutter: ">=3.47.2"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  firebase_app_check: ^0.4.7
  cloud_firestore: ^6.9.0
  cloud_functions: ^6.4.0
  firebase_messaging: ^16.6.0

  # Google sign-in (mobile; web uses FirebaseAuth.signInWithPopup)
  google_sign_in: ^7.2.0

  # Reactive streams = Manager state exposed as BehaviorSubject streams
  rxdart: ^0.28.0

  # Service Locator = global app access to instances of singletons
  get_it: ^9.2.1

  # Routing
  go_router: ^18.0.0

  # Logging
  logging: ^1.3.0

  # Local key/value persistence
  shared_preferences: ^2.5.5

  # Foreground display of FCM notifications on Android
  flutter_local_notifications: ^22.3.0

  # Date/time formatting
  intl: ^0.20.3

  # UI extras
  cupertino_icons: ^1.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.8.1
  fake_cloud_firestore: ^4.2.0
flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

  assets:
    - assets/images/
    - assets/fonts/
